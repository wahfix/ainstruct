name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    name: Instruction integrity
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/health-check.sh
        name: health-check

  distribution:
    runs-on: ubuntu-latest
    name: Distribution smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        name: composer install
      - name: Smoke test ainstruct (PHP entry) in a temp consumer dir
        run: |
          set -euo pipefail
          REPO="$(pwd)"
          TMP="$(mktemp -d)"
          BIN="php $REPO/bin/ainstruct"

          # distribute dari root proyek konsumen (pwd = TMP)
          ( cd "$TMP" && $BIN laravel >/dev/null )
          for expected in \
            AGENTS.md CLAUDE.md GEMINI.md .cursorrules .windsurfrules \
            .continuerules .aider.conf.yml opencode.json \
            .github/copilot-instructions.md \
            .cursor/rules/laravel-directives.mdc \
            .clinerules/laravel-directives.md \
            ai-instructions/master/ai-instructions.md \
            ai-instructions/01-governance.md; do
            test -e "$TMP/$expected" || { echo "MISSING: $expected"; exit 1; }
          done
          grep -q 'default_agent": "build"' "$TMP/opencode.json" \
            || { echo "FAIL: opencode.json tidak mengonfigurasi default build agent"; exit 1; }
          printf '\n# CUSTOM\n' >> "$TMP/ai-instructions/master/ai-instructions.md"
          ( cd "$TMP" && $BIN laravel >/dev/null )
          grep -q 'CUSTOM' "$TMP/ai-instructions/master/ai-instructions.md"
          # reset: buang custom master, master kembali identik template
          ( cd "$TMP" && $BIN reset laravel >/dev/null )
          if grep -q 'CUSTOM' "$TMP/ai-instructions/master/ai-instructions.md"; then
            echo "FAIL: reset harus membuang custom"; exit 1
          fi
          if ! cmp -s "$TMP/ai-instructions/master/ai-instructions.md" "$REPO/templates/laravel/ai-instructions.md"; then
            echo "FAIL: master hasil reset != template"; exit 1
          fi
          # AGENTS.md (hasil distribusi dari master) harus sama dengan template
          if ! cmp -s "$TMP/AGENTS.md" "$REPO/templates/laravel/ai-instructions.md"; then
            echo "FAIL: AGENTS.md setelah reset != template"; exit 1
          fi
          # wipe --force: semua artefak hilang
          ( cd "$TMP" && $BIN wipe --force >/dev/null )
          for gone in \
            AGENTS.md CLAUDE.md GEMINI.md .cursorrules .windsurfrules \
            .continuerules .aider.conf.yml opencode.json \
            .github/copilot-instructions.md \
            ai-instructions .cursor .clinerules .opencode; do
            test -e "$TMP/$gone" && { echo "FAIL: $gone masih ada setelah wipe"; exit 1; }
          done

          # template manager: template milik konsumen (AINSTRUCT_HOME terisolasi)
          export AINSTRUCT_HOME="$TMP/ahome"
          # list: built-in laravel terlihat
          ( cd "$TMP" && $BIN template list | grep 'laravel' >/dev/null ) \
            || { echo "FAIL: list tidak memuat laravel"; exit 1; }
          # clone built-in -> custom (customisasi wajib clone; built-in terproteksi)
          ( cd "$TMP" && $BIN template clone mylaravel laravel >/dev/null )
          test -f "$AINSTRUCT_HOME/templates/mylaravel/ai-instructions.md" \
            || { echo "FAIL: clone tidak membuat template custom"; exit 1; }
          # path custom vs built-in (warn protected)
          ( cd "$TMP" && $BIN template path mylaravel | grep "$AINSTRUCT_HOME" >/dev/null ) \
            || { echo "FAIL: path custom salah"; exit 1; }
          # distribusi memakai template custom: marker konsumen muncul
          mkdir -p "$TMP/proj-custom"
          ( cd "$TMP/proj-custom" && $BIN mylaravel 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | grep 'Template: custom konsumen' >/dev/null ) \
            || { echo "FAIL: distribusi tidak memakai template konsumen"; exit 1; }
          # built-in TERPROTEKSI: tidak bisa dihapus / di-update langsung
          ( cd "$TMP" && $BIN template delete laravel >/dev/null 2>&1 ) \
            && { echo "FAIL: built-in terhapus"; exit 1; }
          ( cd "$TMP" && $BIN template update laravel >/dev/null 2>&1 ) \
            && { echo "FAIL: built-in ter-update"; exit 1; }
          test -d "$REPO/templates/laravel" || { echo "FAIL: built-in hilang"; exit 1; }
          # delete custom tanpa --force di non-interaktif ditolak
          ( cd "$TMP" && $BIN template delete mylaravel >/dev/null 2>&1 ) \
            && { echo "FAIL: delete tanpa force"; exit 1; }
          # update custom dari built-in (--force)
          ( cd "$TMP" && $BIN template update mylaravel --from laravel --force >/dev/null )
          diff -q "$AINSTRUCT_HOME/templates/mylaravel/ai-instructions.md" "$REPO/templates/laravel/ai-instructions.md" >/dev/null \
            || { echo "FAIL: update custom tidak sinkron"; exit 1; }
          # create scaffold kosong
          ( cd "$TMP" && $BIN template create blank >/dev/null )
          test -f "$AINSTRUCT_HOME/templates/blank/ai-instructions.md" \
            || { echo "FAIL: create tidak membuat scaffold"; exit 1; }
          # delete custom --force
          ( cd "$TMP" && $BIN template delete mylaravel --force >/dev/null )
          test -e "$AINSTRUCT_HOME/templates/mylaravel" && { echo "FAIL: custom tidak terhapus"; exit 1; }

          # --- impor template dari sumber git (hermetik: repo git lokal) ---
          export AINSTRUCT_HOME="$TMP/ahome-import"
          GITSRC="$TMP/remote-template"
          mkdir -p "$GITSRC/ai-instructions"
          printf '# AI INSTRUCTION SYSTEM — CONSTITUTION (remote)\n' > "$GITSRC/ai-instructions.md"
          printf '# modul\n' > "$GITSRC/ai-instructions/01-governance.md"
          git -C "$GITSRC" init -q
          git -C "$GITSRC" config user.name 'CI'
          git -C "$GITSRC" config user.email 'ci@test.local'
          git -C "$GITSRC" add -A
          git -C "$GITSRC" commit -qm init
          # create --from: impor dari sumber git + metadata ainstruct.source
          ( cd "$TMP" && $BIN template create remote1 --from "$GITSRC" >/dev/null ) \
            || { echo "FAIL: create --from tidak mengimpor"; exit 1; }
          test -f "$AINSTRUCT_HOME/templates/remote1/ai-instructions.md" \
            || { echo "FAIL: hasil impor tidak punya konstitusi"; exit 1; }
          test -f "$AINSTRUCT_HOME/templates/remote1/ainstruct.source" \
            || { echo "FAIL: ainstruct.source tidak ditulis"; exit 1; }
          grep -q 'source=' "$AINSTRUCT_HOME/templates/remote1/ainstruct.source" \
            || { echo "FAIL: ainstruct.source tidak memuat sumber"; exit 1; }
          # .git/ bawaan clone tidak boleh ikut (template = salinan, bukan repo kerja)
          test ! -e "$AINSTRUCT_HOME/templates/remote1/.git" \
            || { echo "FAIL: .git bocor ke template impor"; exit 1; }
          # update tanpa --from: menarik ulang dari sumber tersimpan
          printf '# AI v2\n' >> "$GITSRC/ai-instructions.md"
          git -C "$GITSRC" add -A && git -C "$GITSRC" commit -qm v2
          ( cd "$TMP" && $BIN template update remote1 --force >/dev/null ) \
            || { echo "FAIL: update tanpa --from gagal"; exit 1; }
          grep -q 'AI v2' "$AINSTRUCT_HOME/templates/remote1/ai-instructions.md" \
            || { echo "FAIL: update tidak menarik sumber tersimpan"; exit 1; }
          # sumber tanpa ai-instructions.md → ditolak
          GITBAD="$TMP/remote-bad"
          mkdir -p "$GITBAD"
          printf 'x\n' > "$GITBAD/README.txt"
          git -C "$GITBAD" init -q
          git -C "$GITBAD" config user.name 'CI'
          git -C "$GITBAD" config user.email 'ci@test.local'
          git -C "$GITBAD" add -A
          git -C "$GITBAD" commit -qm init
          ( cd "$TMP" && $BIN template create badoop --from "$GITBAD" >/dev/null 2>&1 ) \
            && { echo "FAIL: impor tanpa konstitusi harus gagal"; exit 1; }
          test ! -e "$AINSTRUCT_HOME/templates/badoop" \
            || { echo "FAIL: template batal tapi folder tersisa"; exit 1; }

          # adapter: bin/ainstruct via symlink vendor/bin (composer style)
          # Root proyek (src+templates+vendor) + paket lace/ainstruct (bin entry).
          # Entry me-resolve autoload lewat kandidat dependency (../../../autoload.php).
          mkdir -p "$TMP/src" "$TMP/templates"
          cp -r "$REPO/src/." "$TMP/src/"
          cp -r "$REPO/templates/." "$TMP/templates/"
          cp -r "$REPO/vendor/." "$TMP/vendor/"
          mkdir -p "$TMP/vendor/lace/ainstruct/bin" "$TMP/vendor/bin"
          cp "$REPO/bin/ainstruct" "$TMP/vendor/lace/ainstruct/bin/"
          ln -s ../lace/ainstruct/bin/ainstruct "$TMP/vendor/bin/ainstruct"
          ( cd "$TMP" && ./vendor/bin/ainstruct laravel >/dev/null )
          test -f "$TMP/AGENTS.md" || { echo "FAIL: bin/ainstruct tidak mendistribusikan"; exit 1; }
          cmp -s "$TMP/AGENTS.md" "$TMP/templates/laravel/ai-instructions.md" \
            || { echo "FAIL: hasil adapter != template"; exit 1; }

          # --- init: deteksi stack proyek & scaffold otomatis ---
          INITDIR="$TMP/init-larapp"
          mkdir -p "$INITDIR/routes"
          touch "$INITDIR/artisan" "$INITDIR/routes/web.php" "$INITDIR/tsconfig.json"
          printf '{\n  "require": {"laravel/framework": "^12.0"}\n}\n' > "$INITDIR/composer.json"
          printf '{\n  "dependencies": {"@inertiajs/vue3": "^1.0", "vue": "^3.4", "typescript": "^5.0"}\n}\n' > "$INITDIR/package.json"
          # dry-run: laporkan laravel berkeyakinan CONFIRMED, tanpa mengubah proyek
          ( cd "$INITDIR" && $BIN init --dry-run 2>&1 | grep -q 'laravel' ) \
            || { echo "FAIL: init --dry-run tidak melaporkan laravel"; exit 1; }
          ( cd "$INITDIR" && $BIN init --dry-run 2>&1 | grep -q 'CONFIRMED' ) \
            || { echo "FAIL: init tidak melaporkan keyakinan CONFIRMED"; exit 1; }
          test ! -e "$INITDIR/AGENTS.md" || { echo "FAIL: init --dry-run membuat artefak"; exit 1; }
          # init --force: distribusikan template terdeteksi
          ( cd "$INITDIR" && $BIN init --force >/dev/null ) \
            || { echo "FAIL: init --force gagal"; exit 1; }
          test -f "$INITDIR/AGENTS.md" || { echo "FAIL: init tidak mendistribusikan AGENTS.md"; exit 1; }
          # init di proyek tanpa sinyal: harus gagal (tidak pernah menebak)
          EMPTY="$TMP/init-empty"
          mkdir -p "$EMPTY"
          ( cd "$EMPTY" && $BIN init >/dev/null 2>&1 ) \
            && { echo "FAIL: init di proyek kosong harus gagal"; exit 1; }
          # init --template: paksa template tanpa deteksi
          ( cd "$EMPTY" && $BIN init --template laravel --force >/dev/null ) \
            || { echo "FAIL: init --template gagal"; exit 1; }
          test -f "$EMPTY/AGENTS.md" || { echo "FAIL: init --template tidak mendistribusikan"; exit 1; }
          # custom template dengan detektor sendiri menang atas built-in (shadow)
          ( cd "$TMP" && $BIN template create laravel --force >/dev/null )
          printf '5|file|marker-custom|Penanda proyek custom\n' \
            > "$AINSTRUCT_HOME/templates/laravel/ainstruct-detect.txt"
          CUST="$TMP/init-custom"
          mkdir -p "$CUST"
          touch "$CUST/marker-custom"
          ( cd "$CUST" && $BIN init --force 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | grep 'Template: custom konsumen' >/dev/null ) \
            || { echo "FAIL: init tidak memakai template custom (shadow)"; exit 1; }
          test -f "$CUST/AGENTS.md" || { echo "FAIL: init custom tidak mendistribusikan"; exit 1; }
          grep -q 'Template scaffold' "$CUST/AGENTS.md" \
            || { echo "FAIL: AGENTS.md bukan dari template custom"; exit 1; }

          # --- status: laporan kesehatan state instruksi ---
          # AINSTRUCT_HOME di-isolasi ulang — template shadow dari section
          # template-manager/init (blank, laravel scaffold) tidak boleh
          # mencemari deteksi template aktif di section status.
          export AINSTRUCT_HOME="$TMP/ahome-status"
          SDIR="$TMP/status"
          mkdir -p "$SDIR"
          ( cd "$SDIR" && $BIN laravel >/dev/null )
          # proyek sehat: template terdeteksi, artefak lengkap, exit 0
          ( cd "$SDIR" && $BIN status | grep 'laravel' >/dev/null ) \
            || { echo "FAIL: status tidak melaporkan template laravel"; exit 1; }
          ( cd "$SDIR" && $BIN status >/dev/null ) \
            || { echo "FAIL: status di proyek sehat harus exit 0"; exit 1; }
          # JSON murni (tanpa header): status ok + template terdeteksi
          ( cd "$SDIR" && $BIN status --json | grep -q '"status": "ok"' ) \
            || { echo "FAIL: status --json tidak melaporkan ok"; exit 1; }
          ( cd "$SDIR" && $BIN status --json | grep -q '"active_template": "laravel"' ) \
            || { echo "FAIL: status --json tidak melaporkan laravel"; exit 1; }
          # drift: edit AGENTS.md langsung → status mendeteksi & exit 1
          printf '\n# EDITED\n' >> "$SDIR/AGENTS.md"
          ( cd "$SDIR" && $BIN status >/dev/null 2>&1 ) \
            && { echo "FAIL: status harus mendeteksi AGENTS.md drift"; exit 1; }
          # status exit 1 (drift) → tangkap output dulu; pipefail CI akan
          # membalik exit pipeline bila status digabung langsung dengan grep.
          ( cd "$SDIR" && $BIN status 2>&1 || true ) \
            | grep 'AGENTS.md' >/dev/null \
            || { echo "FAIL: status tidak menyebut AGENTS.md sebagai drift"; exit 1; }
          # belum didistribusikan: proyek kosong → masalah & exit 1
          mkdir -p "$TMP/status-empty"
          ( cd "$TMP/status-empty" && $BIN status >/dev/null 2>&1 ) \
            && { echo "FAIL: status di proyek tanpa instruksi harus exit 1"; exit 1; }
          ( cd "$TMP/status-empty" && $BIN status 2>&1 || true ) \
            | grep 'belum' >/dev/null \
            || { echo "FAIL: status tidak menyebut belum didistribusikan"; exit 1; }

          echo "smoke test: PASS"

  phpunit:
    runs-on: ubuntu-latest
    name: PHPUnit
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        name: composer install
      - run: vendor/bin/phpunit
        name: phpunit

  webui-smoke:
    runs-on: ubuntu-latest
    name: WebUI smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        name: composer install
      - name: Smoke test webui (php -S, API, static MIME)
        run: |
          set -euo pipefail
          set -x
          REPO="$(pwd)"
          TMP="$(mktemp -d)"
          export AINSTRUCT_HOME="$TMP/ahome"
          mkdir -p "$AINSTRUCT_HOME"
          php -S 127.0.0.1:8799 -t "$REPO/web" "$REPO/web/index.php" >"$TMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 http://127.0.0.1:8799/api/templates >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          echo "=== server.log ==="
          cat "$TMP/server.log" 2>/dev/null || true
          echo "=== app.js headers ==="
          curl -sI --max-time 10 http://127.0.0.1:8799/assets/app.js || true
          echo "=== readiness check ==="
          if ! curl -fsS --max-time 10 http://127.0.0.1:8799/api/templates >/dev/null 2>&1; then
            echo "FAIL: server webui tidak siap setelah 10 detik"
            tail -5 "$TMP/server.log" 2>/dev/null || true
            exit 1
          fi
          # Aset statis harus disajikan sebagai file nyata, bukan shell SPA.
          # Regresi router pernah mengirim index.html (text/html) untuk aset;
          # MIME .js berbeda antar versi PHP, jadi yang dicek adalah isi body.
          for ASSET in assets/app.js assets/styles.css assets/logo.svg; do
            BODY="$(curl -fsS --max-time 10 "http://127.0.0.1:8799/$ASSET")"
            test -n "$BODY" || { echo "FAIL: $ASSET kosong"; exit 1; }
            if printf '%s' "$BODY" | grep -qi '<!doctype html>'; then
              echo "FAIL: $ASSET disajikan sebagai shell SPA (regresi router)"
              exit 1
            fi
          done
          printf '%s' "$(curl -fsS --max-time 10 http://127.0.0.1:8799/assets/app.js)" \
            | grep -q "'use strict'" \
            || { echo "FAIL: app.js bukan isi JS nyata"; exit 1; }
          # Kontrol positif: path non-aset memang melayani shell SPA.
          curl -fsS --max-time 10 http://127.0.0.1:8799/ | grep -q 'WebUI Template'
          curl -fsS -X POST http://127.0.0.1:8799/api/templates \
            -H 'Content-Type: application/json' -d '{"name":"webtpl"}' | grep -q '"ok": true'
          curl -fsS http://127.0.0.1:8799/api/templates/webtpl | grep -q '"origin": "custom"'
          curl -fsS "http://127.0.0.1:8799/api/templates/webtpl/tree?path=" | grep -q '"entries"'
          curl -fsS "http://127.0.0.1:8799/api/templates/webtpl/file?path=ai-instructions.md" | grep -q '"content"'
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:8799/api/templates/webtpl)"
          test "$CODE" = "409" || { echo "FAIL: delete tanpa force harus 409, dapat $CODE"; exit 1; }
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8799/api/templates/webtpl/file?path=..%2F..%2Fetc%2Fpasswd")"
          test "$CODE" = "422" || { echo "FAIL: traversal harus 422, dapat $CODE"; exit 1; }
          echo "webui smoke: PASS"