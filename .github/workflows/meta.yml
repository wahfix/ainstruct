name: Meta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    name: Shell syntax
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all operator-memory + bin scripts
        run: |
          for s in operator-memory/*.sh bin/*.sh bin/ainstruct; do
            echo "--- $s ---"
            bash -n "$s" || exit 1
          done

  templates:
    runs-on: ubuntu-latest
    name: Template integrity
    steps:
      - uses: actions/checkout@v4
      - name: Verify SKILL.md placeholders
        run: |
          # SKILL.md = mekanisme (sama untuk semua operator) → hanya butuh
          # GITHUB_HANDLE + BACKUP_REPO (identitas repo backup).
          for placeholder in GITHUB_HANDLE BACKUP_REPO; do
            grep -q "{{$placeholder}}" operator-memory/skill/SKILL.md \
              || { echo "FAIL: SKILL.md missing placeholder {{$placeholder}}"; exit 1; }
          done
          echo "SKILL.md placeholders: OK"
      - name: Verify persona.md.start exists and has placeholders
        run: |
          test -f operator-memory/skill/persona.md.start \
            || { echo "FAIL: persona.md.start not found"; exit 1; }
          # persona.md.start = starter personal → placeholder identitas.
          for placeholder in NAME EMAIL GITHUB_HANDLE BACKUP_REPO DATE; do
            grep -q "{{$placeholder}}" operator-memory/skill/persona.md.start \
              || { echo "FAIL: persona.md.start missing placeholder {{$placeholder}}"; exit 1; }
          done
          echo "persona.md.start placeholders: OK"
      - name: Verify context.md.start exists and has placeholders
        run: |
          test -f operator-memory/skill/context.md.start \
            || { echo "FAIL: context.md.start not found"; exit 1; }
          # context.md.start = starter konteks → butuh identitas + tanggal.
          for placeholder in NAME DATE; do
            grep -q "{{$placeholder}}" operator-memory/skill/context.md.start \
              || { echo "FAIL: context.md.start missing placeholder {{$placeholder}}"; exit 1; }
          done
          echo "context.md.start placeholders: OK"
      - name: Verify behavior-log.md.start exists and has placeholders
        run: |
          test -f operator-memory/skill/behavior-log.md.start \
            || { echo "FAIL: behavior-log.md.start not found"; exit 1; }
          # behavior-log.md.start = starter journal perilaku → identitas + tanggal.
          for placeholder in NAME BACKUP_REPO DATE; do
            grep -q "{{$placeholder}}" operator-memory/skill/behavior-log.md.start \
              || { echo "FAIL: behavior-log.md.start missing placeholder {{$placeholder}}"; exit 1; }
          done
          echo "behavior-log.md.start placeholders: OK"
      - name: Verify legacy memory.md.start is gone
        run: |
          test ! -f operator-memory/skill/memory.md.start \
            || { echo "FAIL: memory.md.start legacy masih ada"; exit 1; }
          echo "memory.md.start removed: OK"
      - name: Verify README.md references all scripts
        run: |
          for script in bootstrap-operator-memory.sh backup.sh restore.sh metrics.sh; do
            grep -q "$script" operator-memory/README.md \
              || { echo "FAIL: README.md does not reference $script"; exit 1; }
          done
          echo "README.md references: OK"

  bootstrap:
    runs-on: ubuntu-latest
    name: Bootstrap local-only
    steps:
      - uses: actions/checkout@v4
      - name: Run bootstrap in --local-only mode
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"

          ./operator-memory/bootstrap-operator-memory.sh \
            --name "CI Test" \
            --email "ci@test.local" \
            --local-only

          # Verify skill installed
          test -f "$XDG_CONFIG_HOME/opencode/skills/operator-memory/SKILL.md" \
            || { echo "FAIL: SKILL.md not installed"; exit 1; }

          # Verify persona.md + context.md created (bukan memory.md legacy)
          test -f "$XDG_CONFIG_HOME/opencode/skills/operator-memory/persona.md" \
            || { echo "FAIL: persona.md not created"; exit 1; }
          test -f "$XDG_CONFIG_HOME/opencode/skills/operator-memory/context.md" \
            || { echo "FAIL: context.md not created"; exit 1; }
          test ! -f "$XDG_CONFIG_HOME/opencode/skills/operator-memory/memory.md" \
            || { echo "FAIL: memory.md legacy tidak seharusnya ada di fresh install"; exit 1; }

          # Verify behavior-log.md created (journal SEMUA perilaku)
          test -f "$XDG_CONFIG_HOME/opencode/skills/operator-memory/behavior-log.md" \
            || { echo "FAIL: behavior-log.md not created"; exit 1; }
          grep -q '{{' "$XDG_CONFIG_HOME/opencode/skills/operator-memory/behavior-log.md" \
            && { echo "FAIL: behavior-log.md still has raw placeholder"; exit 1; }

          # Verify repo backup initialized
          test -d "$XDG_CONFIG_HOME/operator-persona/.git" \
            || { echo "FAIL: backup repo not initialized"; exit 1; }

          # Verify SKILL.md has substituted values (not raw placeholders)
          grep -q '{{' "$XDG_CONFIG_HOME/opencode/skills/operator-memory/SKILL.md" \
            && { echo "FAIL: SKILL.md still has raw placeholder"; exit 1; }

          # Verify persona.md: identitas ter-substitute, tanpa placeholder mentah
          grep -q 'CI Test' "$XDG_CONFIG_HOME/opencode/skills/operator-memory/persona.md" \
            || { echo "FAIL: persona.md name not substituted"; exit 1; }
          grep -q '{{' "$XDG_CONFIG_HOME/opencode/skills/operator-memory/persona.md" \
            && { echo "FAIL: persona.md still has raw placeholder"; exit 1; }
          grep -q '{{' "$XDG_CONFIG_HOME/opencode/skills/operator-memory/context.md" \
            && { echo "FAIL: context.md still has raw placeholder"; exit 1; }

          # Verify opencode.jsonc references BOTH persona + context
          grep -q 'persona\.md' "$XDG_CONFIG_HOME/opencode/opencode.jsonc" \
            || { echo "FAIL: opencode.jsonc missing persona.md ref"; exit 1; }
          grep -q 'context\.md' "$XDG_CONFIG_HOME/opencode/opencode.jsonc" \
            || { echo "FAIL: opencode.jsonc missing context.md ref"; exit 1; }

          # Verify backup repo has config files
          test -f "$XDG_CONFIG_HOME/operator-persona/config/skills/operator-memory/SKILL.md" \
            || { echo "FAIL: backup repo missing SKILL.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME/operator-persona/config/skills/operator-memory/persona.md" \
            || { echo "FAIL: backup repo missing persona.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME/operator-persona/config/skills/operator-memory/context.md" \
            || { echo "FAIL: backup repo missing context.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME/operator-persona/config/skills/operator-memory/behavior-log.md" \
            || { echo "FAIL: backup repo missing behavior-log.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME/operator-persona/metrics.sh" \
            || { echo "FAIL: backup repo missing metrics.sh"; exit 1; }

          echo "bootstrap local-only: OK"

  backup-restore:
    runs-on: ubuntu-latest
    name: Backup/restore cycle
    steps:
      - uses: actions/checkout@v4
      - name: Test backup after memory update
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"

          # Bootstrap first
          ./operator-memory/bootstrap-operator-memory.sh \
            --name "Backup Test" \
            --email "backup@test.local" \
            --local-only

          SKILL_DIR="$XDG_CONFIG_HOME/opencode/skills/operator-memory"
          REPO_DIR="$XDG_CONFIG_HOME/operator-persona"

          # Simulate memory update (agent behavior): log baru di context.md
          printf '\n## Log\n- [test] Entry added by CI\n' >> "$SKILL_DIR/context.md"

          # Run backup (salinan di repo backup — REPO_DIR dari lokasi script)
          ( cd "$REPO_DIR" && bash backup.sh 2>&1 ) \
            || { echo "FAIL: backup.sh exited non-zero"; exit 1; }

          # Verify commit was made
          COMMIT_COUNT="$(git -C "$REPO_DIR" log --oneline | wc -l)"
          test "$COMMIT_COUNT" -ge 2 \
            || { echo "FAIL: expected >=2 commits (init + sync), got $COMMIT_COUNT"; exit 1; }

          echo "backup cycle: OK"
      - name: Test restore on fresh directory
        run: |
          set -euo pipefail
          HOME_A="$(mktemp -d)"
          export HOME="$HOME_A"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"

          # Bootstrap
          ./operator-memory/bootstrap-operator-memory.sh \
            --name "Restore Test" \
            --email "restore@test.local" \
            --local-only

          REPO_A="$XDG_CONFIG_HOME/operator-persona"

          # Simulate another device (fresh HOME/XDG): clone backup, restore
          HOME_B="$(mktemp -d)"
          XDG_CONFIG_HOME_B="$HOME_B/.config"
          mkdir -p "$XDG_CONFIG_HOME_B"

          # Copy backup repo to simulate cloned backup
          cp -a "$REPO_A" "$HOME_B/operator-persona"

          # Run restore on device B (HOME/XDG_CONFIG_HOME menunjuk perangkat B)
          env HOME="$HOME_B" XDG_CONFIG_HOME="$XDG_CONFIG_HOME_B" \
            bash "$HOME_B/operator-persona/restore.sh"

          # Verify files restored
          test -f "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/SKILL.md" \
            || { echo "FAIL: restore did not create SKILL.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/persona.md" \
            || { echo "FAIL: restore did not create persona.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/context.md" \
            || { echo "FAIL: restore did not create context.md"; exit 1; }
          test -f "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/behavior-log.md" \
            || { echo "FAIL: restore did not create behavior-log.md"; exit 1; }

          # Verify restored memory matches backup
          diff "$REPO_A/config/skills/operator-memory/persona.md" \
               "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/persona.md" \
            || { echo "FAIL: restored persona does not match backup"; exit 1; }
          diff "$REPO_A/config/skills/operator-memory/context.md" \
               "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/context.md" \
            || { echo "FAIL: restored context does not match backup"; exit 1; }
          diff "$REPO_A/config/skills/operator-memory/behavior-log.md" \
               "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/behavior-log.md" \
            || { echo "FAIL: restored behavior-log does not match backup"; exit 1; }

          # Verify git identity applied by restore (fresh clone of a repo does
          # NOT carry local user.name/user.email; without it backup.sh fails
          # with "Author identity unknown").
          git -C "$HOME_B/operator-persona" config user.name >/dev/null \
            || { echo "FAIL: restore did not set git user.name"; exit 1; }
          git -C "$HOME_B/operator-persona" config user.email >/dev/null \
            || { echo "FAIL: restore did not set git user.email"; exit 1; }

          # Verify backup works on device B right after restore
          # (update context, run backup, must not fail on identity)
          printf '\n## Log\n- [test] post-restore backup on device B\n' \
            >> "$XDG_CONFIG_HOME_B/opencode/skills/operator-memory/context.md"
          env HOME="$HOME_B" XDG_CONFIG_HOME="$XDG_CONFIG_HOME_B" \
            bash "$HOME_B/operator-persona/backup.sh" 2>&1 \
            || { echo "FAIL: backup.sh after restore failed (git identity)"; exit 1; }
          COMMIT_B="$(git -C "$HOME_B/operator-persona" log --oneline | wc -l)"
          test "$COMMIT_B" -ge 2 \
            || { echo "FAIL: expected >=2 commits after post-restore backup, got $COMMIT_B"; exit 1; }

          echo "restore cycle: OK"

  metrics:
    runs-on: ubuntu-latest
    name: Metrics local-only
    steps:
      - uses: actions/checkout@v4
      - name: Run bootstrap and measure metrics
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"

          # Bootstrap
          ./operator-memory/bootstrap-operator-memory.sh \
            --name "Metrics Test" \
            --email "metrics@test.local" \
            --local-only

          SKILL_DIR="$XDG_CONFIG_HOME/opencode/skills/operator-memory"
          REPO_DIR="$XDG_CONFIG_HOME/operator-persona"

          # Tambahkan pelajaran persona + log context agar metrik bermakna
          printf '\n## Koreksi & pelajaran\n- [test] Jangan berasumsi agama operator\n' >> "$SKILL_DIR/persona.md"
          printf '\n- [test] log entry for metrics\n' >> "$SKILL_DIR/context.md"
          ( cd "$REPO_DIR" && bash backup.sh 2>&1 )

          # Human summary must run and exit 0
          ( cd "$REPO_DIR" && bash metrics.sh ) \
            || { echo "FAIL: metrics.sh (human) exited non-zero"; exit 1; }

          # JSON output must be valid and contain expected fields
          JSON_OUT="$( ( cd "$REPO_DIR" && bash metrics.sh --json ) )"
          printf '%s' "$JSON_OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["persona"]["lessons"] >= 1; assert d["context"]["log_entries"] >= 1; assert "balance" in d; assert "growth" in d' \
            || { echo "FAIL: metrics --json invalid or missing fields"; echo "$JSON_OUT"; exit 1; }

          # Live-dir override path (jalankan dari toolkit, bukan repo backup)
          bash operator-memory/metrics.sh --json \
            > /dev/null || { echo "FAIL: metrics.sh from toolkit dir failed"; exit 1; }

          echo "metrics local-only: OK"
